services:
  jupyter:
    build: .
    image: jupyter-pyspark-custom
    container_name: jupyter-pyspark
    ports:
      - "8888:8888"     # Jupyter Lab
      - "4040:4040"     # Spark UI
    volumes:
      - ./notebooks:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=bigdata2026
    restart: unless-stopped

